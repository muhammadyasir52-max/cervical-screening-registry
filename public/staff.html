<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screening Registry Staff</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Screening registry: staff</h1>
      <a href="./">← Public dashboard</a>
    </div>
  </header>
  <main class="wrap">
    <div class="banner">
      <strong>Synthetic demo data.</strong> Names and results are generated; no real patients.
      <label style="display:inline-flex;gap:6px;align-items:center;margin-left:8px">API key
        <input id="api-key" type="password" autocomplete="off" placeholder="only if the server sets one" style="width:200px"></label>
    </div>

    <section class="cols">
      <div class="card">
        <h2>Register a woman</h2>
        <form id="register">
          <div class="row">
            <label>Given name <input name="given" required></label>
            <label>Family name <input name="family" required></label>
          </div>
          <div class="row">
            <label>Date of birth <input name="birthDate" type="date" required></label>
            <label>District
              <select name="district">
                <option>Northfield</option><option>Riverside</option><option>Hillcrest</option>
                <option>Lakeside</option><option>Eastbrook</option><option>Westmoor</option>
              </select>
            </label>
          </div>
          <button>Register</button>
          <div class="msg" id="register-msg" role="status"></div>
        </form>
      </div>

      <div class="card">
        <h2>Record a result or follow-up</h2>
        <form id="result">
          <label>Patient
            <select name="patientId" id="patient-select" required></select>
          </label>
          <div class="row">
            <label>Date <input name="date" type="date" required></label>
            <label>HPV
              <select name="hpv">
                <option value="">—</option><option value="negative">Negative</option>
                <option value="positive">Positive</option><option value="invalid">Invalid</option>
              </select>
            </label>
            <label>Cytology
              <select name="cytology">
                <option value="">—</option><option>NILM</option><option>ASC-US</option><option>LSIL</option>
                <option>ASC-H</option><option>HSIL</option><option>AGC</option><option>SCC</option><option>UNSAT</option>
              </select>
            </label>
          </div>
          <div class="row">
            <button>Save result</button>
            <button type="button" class="secondary" id="colpo">Record colposcopy</button>
          </div>
          <div class="msg" id="result-msg" role="status"></div>
        </form>
      </div>
    </section>

    <section class="card" style="margin-bottom:16px">
      <h2>Active alerts <span class="muted" id="alert-count"></span></h2>
      <div class="table-scroll"><table id="alerts"></table></div>
    </section>

    <section class="card">
      <h2>Worklist</h2>
      <div class="tabs" id="tabs"></div>
      <div class="table-scroll"><table id="worklist"></table></div>
      <p class="muted" id="worklist-note"></p>
    </section>
  </main>
  <script src="staff.js"></script>
</body>
</html>
